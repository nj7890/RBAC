<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">Access Control System</span>
      <div class="d-flex">
        <span class="navbar-text text-white me-3">Welcome, {{ user.username }} ({{ user.role }})</span>
        <a href="/logout" class="btn btn-outline-light">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="row">
      {% for res in resources %}
      <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ res.name }}</h5>
            <a href="/access/{{ res.id }}" class="btn btn-outline-primary">Access File</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>

    {% if user.role == 'admin' %}
    <div class="text-center">
      <a href="/manage" class="btn btn-warning">Manage Access</a>
    </div>
    {% endif %}
  </div>
</body>
</html>
