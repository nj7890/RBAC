{% extends 'base.html' %}
{% block content %}
<h2>Welcome, {{ user.username }}</h2>
<table class="table">
  <thead>
    <tr><th>File</th><th>Actions</th></tr>
  </thead>
  <tbody>
    {% for res in resources %}
    <tr>
      <td>{{ res.name }}</td>
      <td>
        <a href="/view/{{ res.id }}" class="btn btn-info btn-sm">View</a>
        <a href="/edit/{{ res.id }}" class="btn btn-warning btn-sm">Edit</a>
        <form action="/delete/{{ res.id }}" method="POST" style="display:inline">
          <button class="btn btn-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
