<!doctype html>
<html lang="en">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Welcome, {{ user.username }} ({{ user.role }})</h3>
        <div>
            <a href="/logout" class="btn btn-secondary">Logout</a>
            {% if user.role == 'admin' %}
                <a href="/manage" class="btn btn-warning">Manage Access</a>
            {% endif %}
        </div>
    </div>
    <table class="table table-bordered">
        <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Resource</th>
                <th>Access (RBAC)</th>
                <th>Access (ACL)</th>
            </tr>
        </thead>
        <tbody>
            {% for r in resources %}
            <tr>
                <td>{{ r.id }}</td>
                <td>{{ r.name }}</td>
                <td><a class="btn btn-sm btn-info" href="/access/{{ r.id }}?mode=rbac">RBAC</a></td>
                <td><a class="btn btn-sm btn-dark" href="/access/{{ r.id }}?mode=acl">ACL</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
