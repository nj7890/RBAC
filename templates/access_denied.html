<!DOCTYPE html>
<html lang="en">
<head>

  <title>Access Denied</title>

</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card shadow p-4" style="max-width: 400px;">
      <div class="card-body">
        <h1 class="text-danger display-4"><i class="bi bi-shield-lock"></i> Access Denied</h1>

        <a href="/dashboard" class="btn btn-primary mt-3">Back to Dashboard</a>
      </div>
    </div>
  </div>
</body>
</html>
