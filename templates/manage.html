<!DOCTYPE html>
<html>
<head>
  <title>Manage Access</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand">Admin Panel</span>
      <a href="/dashboard" class="btn btn-outline-light">Back to Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white">
        <h5>Grant Access to Resources</h5>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Select User</label>
            <select name="user_id" class="form-select">
              {% for user in users %}
              <option value="{{ user.id }}">{{ user.username }} ({{ user.role }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Select Resource</label>
            <select name="resource_id" class="form-select">
              {% for res in resources %}
              <option value="{{ res.id }}">{{ res.name }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-success">Grant Access</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
