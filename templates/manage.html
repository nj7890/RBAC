<!doctype html>
<html lang="en">
<head>
    <title>Manage Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h3 class="mb-4">Manage Access Control</h3>
    <form method="post" class="card p-4">
        <div class="mb-3">
            <label for="mode" class="form-label">Mode</label>
            <select name="mode" class="form-select" required onchange="toggleFields()">
                <option value="rbac">RBAC (Role-Based)</option>
                <option value="acl">ACL (User-Based)</option>
            </select>
        </div>
        <div id="roleField" class="mb-3">
            <label>Role</label>
            <input name="role" class="form-control">
        </div>
        <div id="userField" class="mb-3" style="display: none;">
            <label>User ID</label>
            <input name="user_id" class="form-control">
        </div>
        <div class="mb-3">
            <label>Resource ID</label>
            <input name="res_id" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Can Access?</label>
            <select name="can_access" class="form-select">
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>
        </div>
        <button class="btn btn-success">Update Access</button>
    </form>
    <a href="/dashboard" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>

<script>
    function toggleFields() {
        let mode = document.querySelector('select[name="mode"]').value;
        document.getElementById('roleField').style.display = (mode === 'rbac') ? 'block' : 'none';
        document.getElementById('userField').style.display = (mode === 'acl') ? 'block' : 'none';
    }
    window.onload = toggleFields;
</script>
</body>
</html>
