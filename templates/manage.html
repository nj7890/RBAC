{% extends 'base.html' %}
{% block content %}
<h2>Manage Access</h2>
<form method="POST">
  <div class="form-group">
    <label>User</label>
    <select name="user_id" class="form-control" required>
      {% for user in users %}
      <option value="{{ user.id }}">{{ user.username }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Resource</label>
    <select name="resource_id" class="form-control" required>
      {% for resource in resources %}
      <option value="{{ resource.id }}">{{ resource.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="form-group">
    <label>Role</label>
    <select name="role" class="form-control" required>
      <option value="reader">Reader</option>
      <option value="editor">Editor</option>
      <option value="owner">Owner</option>
    </select>
  </div>
  <button class="btn btn-primary">Grant Access</button>
</form>

<h3 class="mt-4">Current Access List</h3>
<table class="table table-bordered">
  <thead>
    <tr><th>User</th><th>Resource</th><th>Role</th><th>Action</th></tr>
  </thead>
  <tbody>
    {% for entry in acl_entries %}
    <tr>
      <td>{{ entry.username }}</td>
      <td>{{ entry.resource_name }}</td>
      <td>{{ entry.role }}</td>
      <td>
        <form method="POST" action="/revoke_access">
          <input type="hidden" name="user_id" value="{{ entry.user_id }}">
          <input type="hidden" name="resource_id" value="{{ entry.resource_id }}">
          <button class="btn btn-danger btn-sm">Revoke</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
